name: Throttl package

on:
  push:
    paths:
      - 'src/**'
      - 'test/**'
      - 'benchmark.js'
      - 'README.md'
      - 'RELEASING.md'
      - 'BENCHMARK.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/throttl.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'benchmark.js'
      - 'README.md'
      - 'RELEASING.md'
      - 'BENCHMARK.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/throttl.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: throttl_test
          POSTGRES_PASSWORD: throttl_test
          POSTGRES_DB: throttl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U throttl_test -d throttl_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      TEST_DATABASE_URL: postgresql://throttl_test:throttl_test@127.0.0.1:5432/throttl_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:types
      - run: npm run test:integration
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm pack --dry-run
      - name: Verify the published import in a separate consumer
        run: |
          tarball=$(npm pack --pack-destination "$RUNNER_TEMP" --silent)
          mkdir "$RUNNER_TEMP/throttlkit-consumer"
          npm install --prefix "$RUNNER_TEMP/throttlkit-consumer" "$RUNNER_TEMP/$tarball" --ignore-scripts --no-audit
          cd "$RUNNER_TEMP/throttlkit-consumer"
          node --input-type=module -e "import throttl from 'throttlkit'; const limiter = throttl({limit: 1, windowMs: 60000}); if (!(await limiter.check('user')).allowed || (await limiter.check('user')).allowed) process.exit(1)"
